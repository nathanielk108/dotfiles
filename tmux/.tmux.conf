# -g sets option gloablly
CONFIG=/home/super/.tmux.conf
bind R source-file $CONFIG

set -g default-terminal "st-256color"
set-option -sa terminal-overrides ",st-256color:Tc"

set -s set-clipboard on

PREFIX=C-f
set-option -g prefix $PREFIX
unbind C-b
bind $PREFIX send-prefix

set-option -g base-index 1
set-option -g pane-base-index 1
set-option -g mouse on
set-option -g renumber-window on

bind Q kill-session

bind ` attach -c '#{pane_current_path}'
bind c new-window -c '#{pane_current_path}'
bind v split-window -h -c '#{pane_current_path}'
bind b split-window -v -c '#{pane_current_path}'

# Vim Keybindings
bind -r C-k resize-pane -U
bind -r C-j resize-pane -D
bind -r C-h resize-pane -L
bind -r C-l resize-pane -R

bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

unbind %
unbind \"

unbind Up
unbind Down
unbind Left
unbind Right

unbind C-Up
unbind C-Down
unbind C-Left
unbind C-Right
